
<!doctype html>
<html>
  <head>
    <title>TripsTrapsTrull Kaamera</title>
	<script>
	  let player=null, c=null, g=null, g2=null;
	  let board = [0,0,0,0,0,0,0,0,0]
	  function start(){
	   player=document.getElementById("v1");
	   c=document.getElementById("c1")
	   g=c.getContext("2d");
	   g2=document.getElementById("c2").getContext("2d");
	   currentGame = document.getElementById("gameData")
	   span1=document.getElementById("s1");
	   navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}}}).then((stream) => {
         player.srcObject = stream;
       });
	   setInterval(capture, 3000);
	  }
	  function capture(){
        if (!player.videoWidth) return;
        
        g.drawImage(player, 0, 0, c.width, c.height);

        let step = 100; 
        let sampleSize = 30; 
        let offset = (step - sampleSize) / 2;

        let index = 0;

        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 3; col++) {
            let x = col * step;
            let y = row * step;

            let d = g.getImageData(x + offset, y + offset, sampleSize, sampleSize);
            board[index] = checkColor(d.data);

            index++;
        	}
	  	}
		currentGame.innerHTML = 
		"<b>Massiiv:</b> [" + board.join(", ") + "]<br><br>" +
        "<b>Laua vaade:</b><br>" +
        board.slice(0, 3).join(" ") + "<br>" +
        board.slice(3, 6).join(" ") + "<br>" +
        board.slice(6, 9).join(" ");
	}

	    function checkColor(data) {
        let r = 0, g = 0, b = 0;
        let count = data.length / 4;

        for (let i = 0; i < data.length; i += 4) {
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
        }
        r /= count; g /= count; b /= count;

        if (r > 120 && r > g * 1.3 && r > b * 1.3) return 1;
        if (b > 100 && b > r * 1.2) return 2;
        return 0;
      }

	</script>
  </head>
  <body onload="start()">
    <video id="v1" controls autoplay style="width: 45%" ></video>
	<canvas id="c1" width="300" height="300" style="width: 45%" ></canvas><br />	 
	<canvas id="c2" width="40" height="40" ></canvas>	
    <span id="gameData"></span>
  </body>
</html>
